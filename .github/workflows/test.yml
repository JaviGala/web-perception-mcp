name: Test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Bump branch version to 0.1.3
        if: github.event_name == 'push' && github.ref_name == 'agent/strengthen-json-output-prompt'
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.version = '0.1.3';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, '\t')}\n`);

          const packageLock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          packageLock.version = '0.1.3';
          packageLock.packages[''].version = '0.1.3';
          fs.writeFileSync('package-lock.json', `${JSON.stringify(packageLock, null, '\t')}\n`);

          const serverPath = 'src/server.js';
          const oldVersion = 'version: "0.1.2",';
          const newVersion = 'version: "0.1.3",';
          const server = fs.readFileSync(serverPath, 'utf8');
          const occurrences = server.split(oldVersion).length - 1;
          if (occurrences !== 1) {
            throw new Error(`Expected one server version occurrence, found ${occurrences}`);
          }
          fs.writeFileSync(serverPath, server.replace(oldVersion, newVersion));
          NODE

          changed_files="$(git diff --name-only)"
          expected_files="$(printf '%s\n' package-lock.json package.json src/server.js)"
          test "$changed_files" = "$expected_files"
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/server.js
          git commit -m "Bump version to 0.1.3 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
