name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Run MCP image-validation smoke test
        run: |
          node --input-type=module <<'NODE'
          import { Client } from "@modelcontextprotocol/sdk/client/index.js";
          import { StdioClientTransport } from "@modelcontextprotocol/sdk/client/stdio.js";

          const transport = new StdioClientTransport({
            command: "node",
            args: ["src/server.js"],
            env: {
              ...process.env,
              VISION_API_KEY: "smoke-test-key",
              VISION_BASE_URL: "http://127.0.0.1:9/v1",
              ALLOWED_IMAGE_DIRS: process.cwd(),
            },
          });
          const client = new Client(
            { name: "image-validation-smoke", version: "1.0.0" },
            { capabilities: {} },
          );

          try {
            await client.connect(transport);
            const result = await client.callTool({
              name: "analyze_image",
              arguments: {
                image_path: "/etc/hosts",
                prompt: "Describe this image.",
                response_format: "text",
              },
            });
            const payload = JSON.parse(result.content[0].text);
            if (payload.ok !== false || payload.error?.code !== "IMAGE_PATH_NOT_ALLOWED") {
              throw new Error(`Unexpected MCP response: ${JSON.stringify(result)}`);
            }
            const serialized = JSON.stringify(result);
            if (serialized.includes("127.0.0.1") || serialized.includes("localhost")) {
              throw new Error("Rejected file contents may have been exposed");
            }
            console.log(JSON.stringify(payload));
          } finally {
            await client.close();
          }
          NODE
