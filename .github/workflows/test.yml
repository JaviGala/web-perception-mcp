name: Test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  refine-metadata:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/improve-tool-discovery
          fetch-depth: 0

      - name: Apply metadata refinement
        run: python scripts/refine-metadata-temp.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run tests
        run: npm test

      - name: Commit metadata refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js test/server-metadata.test.js
          git commit -m "Refine MCP instructions and tool descriptions"
          git push origin HEAD:agent/improve-tool-discovery
