name: Test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/improve-tool-discovery
          fetch-depth: 0

      - name: Capture refinement result
        run: |
          set +e
          python scripts/refine-metadata-temp.py > metadata-refine.txt 2>&1
          code=$?
          echo "exit_code=$code" >> metadata-refine.txt
          echo "--- git diff --stat ---" >> metadata-refine.txt
          git diff --stat >> metadata-refine.txt
          exit 0

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata-refine.txt
          git commit -m "Capture MCP metadata refinement result"
          git push origin HEAD:agent/improve-tool-discovery
