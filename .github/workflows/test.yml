name: Test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run tests
        run: npm test

  finalize-coverage-fix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/improve-tool-discovery
          fetch-depth: 0

      - name: Align description
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/server.js')
          text = path.read_text()
          old = 'Sections mode may send multiple images, increase latency and provider usage, and return a coverage warning if the limit is reached before the page end.'
          new = 'Sections may send multiple images, increase latency and provider usage, and return coverage metadata plus a warning if the limit is reached before the page end.'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one description match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run updated tests
        run: npm test

      - name: Commit final fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm test-failure.txt
          git add src/server.js
          git commit -m "Finalize sections coverage warning"
          git push origin HEAD:agent/improve-tool-discovery
