name: Test

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run tests
        run: npm test

  diagnose-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/improve-tool-discovery
          fetch-depth: 0

      - name: Shorten description
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/server.js')
          text = path.read_text()
          old = 'Sections mode may send multiple images and increase latency and provider usage; it returns coverage metadata and a warning when the configured limit is reached before the page end.'
          new = 'Sections mode may send multiple images, increase latency and provider usage, and return a coverage warning if the limit is reached before the page end.'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Capture test output
        run: |
          set +e
          npm test > /tmp/test-output.txt 2>&1
          status=$?
          {
            echo "exit_status=$status"
            tail -n 220 /tmp/test-output.txt
          } > test-failure.txt
          exit 0

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js test-failure.txt
          git commit -m "Diagnose sections coverage tests"
          git push origin HEAD:agent/improve-tool-discovery
