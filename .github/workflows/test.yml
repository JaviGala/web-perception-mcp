name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  finish-runtime-default:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix runtime default and add regression check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server_path = Path("src/server.js")
          server = server_path.read_text()
          old_runtime = '''		const result = await capturePage(args, {
          			defaultScreenshotMode: "sections",
          			maxSectionsMaximum: 8,
          		});'''
          new_runtime = '''		const result = await capturePage(args, {
          			defaultScreenshotMode: "viewport",
          			maxSectionsMaximum: 8,
          		});'''
          if new_runtime not in server:
              count = server.count(old_runtime)
              if count != 1:
                  raise SystemExit(f"Expected one analyze-page runtime block, found {count}")
              server_path.write_text(server.replace(old_runtime, new_runtime))
              print("Updated runtime screenshot default")
          else:
              print("Runtime screenshot default already correct")

          test_path = Path("test/server-metadata.test.js")
          test_text = test_path.read_text()
          anchor = '''	assert.equal(analyzePage.inputSchema.properties.screenshot_mode.default, "viewport");'''
          regression = '''	assert.match(
          		readFileSync(serverPath, "utf8"),
          		/async function handleAnalyzePageScreenshot[\\s\\S]*?defaultScreenshotMode:\\s*"viewport"/,
          	);'''
          if regression not in test_text:
              if test_text.count(anchor) != 1:
                  raise SystemExit("Could not find unique analyze-page default assertion")
              test_path.write_text(test_text.replace(anchor, anchor + "\n" + regression))
              print("Added runtime-default regression assertion")
          else:
              print("Runtime-default regression assertion already present")
          PY

      - name: Check server syntax
        run: node --check src/server.js

      - name: Check diff formatting
        run: git diff --check

      - name: Run metadata contract test
        run: node --test test/server-metadata.test.js

      - name: Commit completed changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js test/server-metadata.test.js
          git commit -m "Align analyze-page runtime default"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run tests
        run: npm test
