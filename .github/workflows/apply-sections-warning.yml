name: Apply sections coverage warning

on:
  push:
    branches:
      - agent/improve-tool-discovery
    paths:
      - .github/workflows/apply-sections-warning.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/improve-tool-discovery
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply implementation and tests
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          # src/browser.js: expose objective sections coverage metadata.
          replace_once(
              "src/browser.js",
              "\tlet sections = null;\n",
              "\tlet sections = null;\n\tlet coverage = null;\n",
          )
          replace_once(
              "src/browser.js",
              "\t\tsections = result.sections;\n\t\tdimensions = result.dimensions;\n",
              "\t\tsections = result.sections;\n\t\tcoverage = result.coverage;\n\t\tdimensions = result.dimensions;\n",
          )
          replace_once(
              "src/browser.js",
              "\t\t\tmode,\n\t\t\tsections,\n\t\t},\n",
              "\t\t\tmode,\n\t\t\tsections,\n\t\t\t...(coverage || {}),\n\t\t},\n",
          )
          replace_once(
              "src/browser.js",
              "\tawait page.evaluate(({ x, y }) => window.scrollTo(x, y), originalScroll);\n\n\treturn { paths, sections, dimensions };\n",
              "\tconst finalDimensions = await getPageDimensions(page, dimensions);\n\tconst lastSection = sections.at(-1);\n\tconst lastCapturedBottom = lastSection\n\t\t? Math.min(finalDimensions.height, lastSection.y + lastSection.height)\n\t\t: 0;\n\tconst reachedEnd = lastCapturedBottom >= finalDimensions.height;\n\tconst coverage = {\n\t\tdocument_height: finalDimensions.height,\n\t\tlast_captured_bottom: lastCapturedBottom,\n\t\tremaining_pixels: Math.max(0, finalDimensions.height - lastCapturedBottom),\n\t\treached_end: reachedEnd,\n\t\ttruncated: !reachedEnd,\n\t\tmax_sections_reached: sections.length >= maxSections,\n\t\tmax_sections: maxSections,\n\t};\n\n\tawait page.evaluate(({ x, y }) => window.scrollTo(x, y), originalScroll);\n\n\treturn { paths, sections, dimensions: finalDimensions, coverage };\n",
          )

          # src/screenshot-result.js: centralise warnings and pass coverage to the vision model.
          Path("src/screenshot-result.js").write_text('''// screenshot-result.js — helpers for normalising screenshot capture results

export function screenshotSections(screenshot) {
\tif (Array.isArray(screenshot?.metadata?.sections)) return screenshot.metadata.sections;
\tif (Array.isArray(screenshot?.sections)) return screenshot.sections;
\treturn [];
}

export function screenshotImagePaths(screenshot) {
\tconst paths = Array.isArray(screenshot?.paths)
\t\t? screenshot.paths.filter(Boolean)
\t\t: [];
\tif (paths.length > 0) return paths;

\tconst sectionPaths = screenshotSections(screenshot)
\t\t.map((section) => section?.path)
\t\t.filter(Boolean);
\tif (sectionPaths.length > 0) return sectionPaths;

\treturn screenshot?.path ? [screenshot.path] : [];
}

export function screenshotCoverage(screenshot) {
\tconst metadata = screenshot?.metadata || screenshot;
\tif (metadata?.mode !== "sections" || typeof metadata.reached_end !== "boolean") return null;

\treturn {
\t\tdocument_height: metadata.document_height,
\t\tlast_captured_bottom: metadata.last_captured_bottom,
\t\tremaining_pixels: metadata.remaining_pixels,
\t\treached_end: metadata.reached_end,
\t\ttruncated: metadata.truncated,
\t\tmax_sections_reached: metadata.max_sections_reached,
\t\tmax_sections: metadata.max_sections,
\t};
}

export function screenshotCaptureWarnings(screenshot) {
\tconst coverage = screenshotCoverage(screenshot);
\tif (!coverage?.truncated) return [];

\tif (coverage.max_sections_reached) {
\t\treturn [
\t\t\t`Sections capture reached the maximum of ${coverage.max_sections} screenshots before the end of the page. ${coverage.remaining_pixels} vertical pixels were not captured.`,
\t\t];
\t}

\treturn ["Sections capture ended before reaching the end of the page."];
}

export function buildScreenshotSectionContext(screenshot) {
\tconst sections = screenshotSections(screenshot);
\tif (sections.length === 0) return "";

\tconst lines = ["", "SCREENSHOT SEGMENTS:"];
\tfor (const section of sections) {
\t\tlines.push(
\t\t\t`- Section ${section.index}: y=${section.y}, height=${section.height}, path=${section.path}`,
\t\t);
\t}

\tconst coverage = screenshotCoverage(screenshot);
\tif (coverage) {
\t\tlines.push("", "SECTION COVERAGE:");
\t\tlines.push(
\t\t\t`- document_height=${coverage.document_height}, last_captured_bottom=${coverage.last_captured_bottom}, remaining_pixels=${coverage.remaining_pixels}, reached_end=${coverage.reached_end}, truncated=${coverage.truncated}, max_sections_reached=${coverage.max_sections_reached}`,
\t\t);
\t\tfor (const warning of screenshotCaptureWarnings(screenshot)) {
\t\t\tlines.push(`- WARNING: ${warning}`);
\t\t}
\t}

\treturn lines.join("\\n");
}
''')

          # src/server.js: surface warnings in both webpage tools and clarify semantics.
          replace_once(
              "src/server.js",
              'import { buildScreenshotSectionContext, screenshotImagePaths } from "./screenshot-result.js";\n',
              'import {\n\tbuildScreenshotSectionContext,\n\tscreenshotCaptureWarnings,\n\tscreenshotImagePaths,\n} from "./screenshot-result.js";\n',
          )
          replace_once(
              "src/server.js",
              '\t"Use sections only when the task requires ordered coverage across a long page or multiple scroll positions; do not choose it merely as a precaution because it can create and analyze multiple images.",\n',
              '\t"Use sections only when the task requires ordered coverage across a long page or multiple scroll positions; do not choose it merely as a precaution because it can create and analyze multiple images.",\n\t"Sections mode does not guarantee complete-page coverage; check the returned coverage metadata and warnings before claiming that the end of the page was reached.",\n',
          )
          replace_once(
              "src/server.js",
              '"Use viewport by default for short pages, the initial visible state, or when the task does not require content below the first viewport. Use sections only when the task requires ordered coverage of a long page or multiple scroll positions, such as comparing distant sections or inspecting sticky UI. Do not use sections merely \'to be safe\' because it can create and analyze multiple images. Use full_page only when one complete-page image is specifically required and the page is reasonably short. Use element only for one CSS selector.",',
              '"Use viewport by default for short pages, the initial visible state, or when the task does not require content below the first viewport. Use sections only when the task requires ordered coverage of a long page or multiple scroll positions, such as comparing distant sections or inspecting sticky UI. Do not use sections merely \'to be safe\' because it can create and analyze multiple images, and do not assume it covers the complete page: check the returned coverage metadata and warnings. Use full_page only when one complete-page image is specifically required and the page is reasonably short. Use element only for one CSS selector.",',
          )
          replace_once(
              "src/server.js",
              'description: "Maximum number of ordered viewport screenshots when screenshot_mode is sections.",',
              'description: "Maximum number of ordered viewport screenshots when screenshot_mode is sections. If this limit is reached before the page end, the result reports incomplete coverage and returns a warning.",',
          )
          replace_once(
              "src/server.js",
              'Sections mode may send multiple images and increase latency and provider usage.',
              'Sections mode may send multiple images and increase latency and provider usage; it returns coverage metadata and a warning when the configured limit is reached before the page end.',
          )
          replace_once(
              "src/server.js",
              "\t\t\tpageHealth.warnings,\n\t\t\t{\n\t\t\t\ttool: \"capture_page_screenshot\",",
              "\t\t\t[...pageHealth.warnings, ...screenshotCaptureWarnings(result.screenshot)],\n\t\t\t{\n\t\t\t\ttool: \"capture_page_screenshot\",",
          )
          replace_once(
              "src/server.js",
              "\t\tconst warnings = [\n\t\t\t...pageHealth.warnings,\n\t\t\t...(parsed?.warning ? [parsed.warning] : []),\n\t\t];",
              "\t\tconst warnings = [\n\t\t\t...pageHealth.warnings,\n\t\t\t...screenshotCaptureWarnings(result.screenshot),\n\t\t\t...(parsed?.warning ? [parsed.warning] : []),\n\t\t];",
          )

          # Browser-level coverage tests.
          replace_once(
              "test/browser.test.js",
              "\t\tassert.equal(screenshot.metadata.sections.length, 3);\n\t\tassert.equal(screenshot.metadata.sections[0].index, 1);",
              "\t\tassert.equal(screenshot.metadata.sections.length, 3);\n\t\tassert.equal(screenshot.metadata.max_sections, 3);\n\t\tassert.equal(screenshot.metadata.max_sections_reached, true);\n\t\tassert.equal(screenshot.metadata.reached_end, false);\n\t\tassert.equal(screenshot.metadata.truncated, true);\n\t\tassert.equal(\n\t\t\tscreenshot.metadata.last_captured_bottom < screenshot.metadata.document_height,\n\t\t\ttrue,\n\t\t);\n\t\tassert.equal(\n\t\t\tscreenshot.metadata.remaining_pixels,\n\t\t\tscreenshot.metadata.document_height - screenshot.metadata.last_captured_bottom,\n\t\t);\n\t\tassert.equal(screenshot.metadata.sections[0].index, 1);",
          )
          replace_once(
              "test/browser.test.js",
              "\t\tassert.equal(lastSection.y + lastSection.height >= screenshot.metadata.dimensions.height, true);",
              "\t\tassert.equal(lastSection.y + lastSection.height >= screenshot.metadata.dimensions.height, true);\n\t\tassert.equal(screenshot.metadata.reached_end, true);\n\t\tassert.equal(screenshot.metadata.truncated, false);\n\t\tassert.equal(screenshot.metadata.remaining_pixels, 0);\n\t\tassert.equal(\n\t\t\tscreenshot.metadata.last_captured_bottom,\n\t\t\tscreenshot.metadata.document_height,\n\t\t);",
          )

          # Unit tests for prompt context and user-visible warnings.
          Path("test/screenshot-result.test.js").write_text('''import test from "node:test";
import assert from "node:assert/strict";

import {
\tbuildScreenshotSectionContext,
\tscreenshotCaptureWarnings,
\tscreenshotCoverage,
\tscreenshotImagePaths,
\tscreenshotSections,
} from "../src/screenshot-result.js";

function sectionScreenshot(overrides = {}) {
\treturn {
\t\tpath: "/tmp/web-perception-mcp/web-perception-screenshot-1-section-1.png",
\t\tpaths: [
\t\t\t"/tmp/web-perception-mcp/web-perception-screenshot-1-section-1.png",
\t\t\t"/tmp/web-perception-mcp/web-perception-screenshot-1-section-2.png",
\t\t\t"/tmp/web-perception-mcp/web-perception-screenshot-1-section-3.png",
\t\t],
\t\tmetadata: {
\t\t\tmode: "sections",
\t\t\tsections: [
\t\t\t\t{ index: 1, path: "/tmp/web-perception-mcp/web-perception-screenshot-1-section-1.png", y: 0, height: 900 },
\t\t\t\t{ index: 2, path: "/tmp/web-perception-mcp/web-perception-screenshot-1-section-2.png", y: 780, height: 900 },
\t\t\t\t{ index: 3, path: "/tmp/web-perception-mcp/web-perception-screenshot-1-section-3.png", y: 1560, height: 900 },
\t\t\t],
\t\t\tdocument_height: 3000,
\t\t\tlast_captured_bottom: 2460,
\t\t\tremaining_pixels: 540,
\t\t\treached_end: false,
\t\t\ttruncated: true,
\t\t\tmax_sections_reached: true,
\t\t\tmax_sections: 3,
\t\t\t...overrides,
\t\t},
\t};
}

test("screenshotImagePaths uses all explicit section paths", () => {
\tconst screenshot = sectionScreenshot();
\tassert.deepEqual(screenshotImagePaths(screenshot), screenshot.paths);
\tassert.deepEqual(screenshotSections(screenshot), screenshot.metadata.sections);
});

test("screenshotImagePaths falls back to metadata section paths", () => {
\tconst screenshot = sectionScreenshot();
\tdelete screenshot.paths;

\tassert.deepEqual(screenshotImagePaths(screenshot), [
\t\t"/tmp/web-perception-mcp/web-perception-screenshot-1-section-1.png",
\t\t"/tmp/web-perception-mcp/web-perception-screenshot-1-section-2.png",
\t\t"/tmp/web-perception-mcp/web-perception-screenshot-1-section-3.png",
\t]);
});

test("screenshotImagePaths falls back to single screenshot path", () => {
\tassert.deepEqual(screenshotImagePaths({ path: "/tmp/web-perception-mcp/web-perception-screenshot-1.png" }), [
\t\t"/tmp/web-perception-mcp/web-perception-screenshot-1.png",
\t]);
});

test("buildScreenshotSectionContext includes segments and incomplete coverage", () => {
\tconst context = buildScreenshotSectionContext(sectionScreenshot());

\tassert.match(context, /SCREENSHOT SEGMENTS/);
\tassert.match(context, /Section 1: y=0, height=900/);
\tassert.match(context, /Section 3: y=1560, height=900/);
\tassert.match(context, /SECTION COVERAGE/);
\tassert.match(context, /remaining_pixels=540/);
\tassert.match(context, /reached_end=false/);
\tassert.match(context, /WARNING: Sections capture reached the maximum of 3 screenshots/);
});

test("screenshotCaptureWarnings reports when max_sections truncates the page", () => {
\tconst screenshot = sectionScreenshot();

\tassert.deepEqual(screenshotCoverage(screenshot), {
\t\tdocument_height: 3000,
\t\tlast_captured_bottom: 2460,
\t\tremaining_pixels: 540,
\t\treached_end: false,
\t\ttruncated: true,
\t\tmax_sections_reached: true,
\t\tmax_sections: 3,
\t});
\tassert.deepEqual(screenshotCaptureWarnings(screenshot), [
\t\t"Sections capture reached the maximum of 3 screenshots before the end of the page. 540 vertical pixels were not captured.",
\t]);
});

test("screenshotCaptureWarnings is empty when sections reach the page end", () => {
\tconst screenshot = sectionScreenshot({
\t\tdocument_height: 2460,
\t\tlast_captured_bottom: 2460,
\t\tremaining_pixels: 0,
\t\treached_end: true,
\t\ttruncated: false,
\t});

\tassert.deepEqual(screenshotCaptureWarnings(screenshot), []);
});
''')

          # Metadata contract tests require clients to be told about coverage limits.
          replace_once(
              "test/server-metadata.test.js",
              '\t\t"multiple scroll positions",\n\t\t"complete-page image",',
              '\t\t"multiple scroll positions",\n\t\t"does not guarantee complete-page coverage",\n\t\t"complete-page image",',
          )
          replace_once(
              "test/server-metadata.test.js",
              "\tassert.match(analyzePage.description, /multiple images/i);",
              "\tassert.match(analyzePage.description, /multiple images/i);\n\tassert.match(analyzePage.description, /coverage metadata/i);\n\tassert.match(analyzePage.description, /returns? .*warning/i);",
          )
          replace_once(
              "test/server-metadata.test.js",
              "\tassert.match(analyzePage.inputSchema.properties.screenshot_mode.description, /multiple images/i);",
              "\tassert.match(analyzePage.inputSchema.properties.screenshot_mode.description, /multiple images/i);\n\tassert.match(\n\t\tanalyzePage.inputSchema.properties.screenshot_mode.description,\n\t\t/do not assume it covers the complete page/i,\n\t);\n\tassert.match(analyzePage.inputSchema.properties.max_sections.description, /returns a warning/i);",
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium Headless Shell
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run tests
        run: npm test

      - name: Commit changes and remove temporary workflow
        run: |
          rm .github/workflows/apply-sections-warning.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Warn when sections coverage is incomplete"
          git push origin HEAD:agent/improve-tool-discovery
